# 보직회의 지원 시스템
# 문서 루트에는 `web/dist` 내용물을 둔다.
# TLS 인증서와 listen 포트는 대학 서버에 이미 있는 값을 유지한다.

server {
    listen 443 ssl;
    server_name depthm.yeonsung.ac.kr;

    root /var/www/depthm;
    index index.html;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    location /assets/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    location = /sw.js {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-cache" always;
    }

    # 자료 API. node server/api.mjs 가 127.0.0.1:8787 로 떠 있어야 한다.
    # 끝 슬래시가 있어 /materials-api/ 접두사는 127.0.0.1:8787/ 로 넘어간다.
    # /var/www/depthm-data 는 문서 루트가 아니다. 여기 location 으로 열지 않는다.
    location /materials-api/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        client_max_body_size 40m;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
